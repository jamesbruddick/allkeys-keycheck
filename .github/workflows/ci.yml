name: CI

# Everything that reaches main, and everything proposed for it. The release
# workflow only fires on a version bump and goes straight to publishing signed
# binaries, so this is the gate that stands between a broken commit and a
# download — it has to run on the commits themselves, not on the release.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Superseded runs are cancelled: a push that lands on top of another one has
# already answered the question the first was asking.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Formatting first: it is the cheapest to run and the cheapest to fix, so
      # failing on it should not cost a full test run.
      - run: cargo fmt --check

      # --all-targets so the tests are linted too, and warnings are errors:
      # a lint worth having is one that cannot be scrolled past.
      - run: cargo clippy --all-targets --locked -- -D warnings

      # --locked so a Cargo.lock that no longer matches the manifest fails here
      # rather than in the release build, which uses --locked too.
      - run: cargo test --locked

  # `rust-version` is a promise to anyone building from source, and the README
  # repeats it. Nothing else in this workflow runs on anything but stable, so
  # without this the promise is only ever an assertion — the code drifts forward
  # onto whatever the toolchain of the day allows, and the first person to find
  # out is someone whose build fails. The version is read out of the manifest
  # rather than written here, so there is one place to change it.
  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      # `check`, not `test`: what the floor has to prove is that the code and
      # the locked dependencies still compile on it, not that they behave
      # differently there.
      - run: cargo check --all-targets --locked

  # The unix-only code paths — the 0600 output file and the 0600 config — have
  # `#[cfg(not(unix))]` counterparts that nothing else ever compiles, and the
  # release publishes a Windows binary. A check on the one platform the rest of
  # this workflow cannot speak for keeps that branch from rotting until release
  # day. `cargo check` rather than a test run: it is the compile that is at risk.
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows

      - run: cargo check --all-targets --locked
