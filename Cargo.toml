[package]
name = "allkeys-keycheck"
version = "0.3.0"
edition = "2024"
rust-version = "1.87"

[dependencies]
bip39 = "2.2.2"
bitcoin = "0.32.102"
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }
toml = { version = "0.9.12", default-features = false, features = ["parse", "serde"] }
rayon = "1.12.0"
reqwest = { version = "0.13.4", default-features = false, features = [
    "blocking",
    "charset",
    "form",
    "http2",
    "json",
    "rustls",
    "system-proxy",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
