[package]
name = "allkeys-keycheck"
version = "0.1.0"
edition = "2021"

[dependencies]
bitcoin = "0.32"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
# 0.13 made `form` opt-in; the balance endpoint is POSTed as form-encoded.
reqwest = { version = "0.13", features = ["blocking", "json", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
